services:
  # Backend Web Service (Spring Boot 3 + Java 21 in Docker)
  - type: web
    name: cloudshare-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        value: dpg-dbvj5at9fdbs73bdes3g-a
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: cloudshare
      - key: DB_USER
        value: cloudshare
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        value: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - key: S3_ENDPOINT
        value: https://611e227a0e2b19deaaff8fec178915d1.r2.cloudflarestorage.com
      - key: S3_PUBLIC_ENDPOINT
        value: https://611e227a0e2b19deaaff8fec178915d1.r2.cloudflarestorage.com
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: cloudshare-files
      - key: S3_ACCESS_KEY
        value: 7fd6592e343a65c013aee1ea171d7481
      - key: S3_SECRET_KEY
        value: 29b3a6de0e3ba0de0df6f319ceca1c0c3deb9f5686405d0d73c256983ee8c1b2
      - key: S3_PATH_STYLE
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # Frontend Static Site (Angular 20 SPA)
  - type: web
    name: cloudshare-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist/cloudshare-frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
