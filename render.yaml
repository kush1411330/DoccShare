services:
  # Backend Web Service (Spring Boot 3 + Java 21 in Docker)
  - type: web
    name: cloudshare-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: S3_REGION
        value: auto
      - key: S3_PATH_STYLE
        value: "true"

  # Frontend Static Site (Angular 20 SPA)
  - type: web
    name: cloudshare-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist/cloudshare-frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
