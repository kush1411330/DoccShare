server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: cloudshare-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cloudshare}
    username: ${DB_USER:cloudshare}
    password: ${DB_PASSWORD:cloudshare123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_BYTES:104857600}
      max-request-size: ${MAX_UPLOAD_BYTES:104857600}

# CloudShare Application Configuration
cloudshare:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:60}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:${cloudshare.s3.endpoint}}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:cloudshare-files}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    path-style: ${S3_PATH_STYLE:true}
  storage:
    max-upload-bytes: ${MAX_UPLOAD_BYTES:104857600} # 100MB default
    upload-url-expiry-minutes: 10
    download-url-expiry-seconds: 60
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:80,http://localhost}
  app:
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:4200}
    geoip-db-path: ${GEOIP_DB_PATH:classpath:geoip/GeoLite2-City.mmdb}
    ip-hash-salt: ${IP_HASH_SALT:cloudshare-salt-for-privacy-preserving-hashing}
  ratelimit:
    auth-attempts-per-minute: 10
    download-requests-per-minute: 30

# Actuator & OpenAPI
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
